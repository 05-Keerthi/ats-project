services:
  db:
    image: postgres:15-alpine
    container_name: ats_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-job_portal_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network

  web:
    build: .
    container_name: ats_django
    command: sh -c "gunicorn backend.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 3 --timeout 120"
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ats_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:

networks:
  ats_network:
    driver: bridge