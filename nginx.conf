server {
    listen 8081;
    server_name localhost;
    
    # IMPORTANT: Use the X-Forwarded headers from the backend proxy
    # This prevents port 8081 from appearing in redirects
    port_in_redirect off;
    absolute_redirect off;
    
    # Handle the base path for the app
    location /applicant-tracking-system/frontend/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ /applicant-tracking-system/frontend/index.html;
        
        # Add MIME type configuration for JS files
        location ~* \.(js|mjs|jsx|ts|tsx)$ {
            add_header Content-Type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Add MIME type configuration for CSS files
        location ~* \.(css)$ {
            add_header Content-Type text/css;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Handle missing trailing slash - return relative redirect only
    location = /applicant-tracking-system/frontend {
        return 301 /applicant-tracking-system/frontend/;
    }
    
    # Fallback for root path - redirect to base path
    location / {
        return 301 /applicant-tracking-system/frontend/;
    }
}
